<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlacklightDoms - Cinematic Staff Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #000000;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --font-main: 'Outfit', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Loading Screen Awal */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; }

        /* Audio Background (Idoberg Cinematic Pads) */
        #cinematic-audio { display: none; }

        /* =======================================================
           20-DETIK CINEMATIC EXPERIENCE SCREEN (STRICT AAA GAME STYLE)
           ======================================================= */
        #cinematic-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; opacity: 0; transition: opacity 0.8s ease;
            overflow: hidden;
        }
        #cinematic-screen.active { display: flex; opacity: 1; }

        /* Vignette Hitam di Pinggir Layar */
        .cinematic-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.85) 100%);
            opacity: 0; transition: opacity 2s ease;
        }
        .cinematic-vignette.active { opacity: 1; }

        /* Kabut Radial Gradient Tipis */
        .cinematic-fog {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;
            background: radial-gradient(circle at center, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 70%);
            opacity: 0; transition: opacity 2s ease; filter: blur(40px);
        }
        .cinematic-fog.active { opacity: 1; }

        /* Canvas untuk Particle Debu Halus */
        #particle-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3;
        }

        /* Stage Logo & Lingkaran Glow Belakang */
        .cinematic-stage {
            position: relative; width: 300px; height: 300px;
            display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
            transition: transform 3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .radial-glow-back {
            position: absolute; width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 70%);
            opacity: 0; transform: scale(0.5); transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 4;
        }

        .cinematic-logo-img {
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            z-index: 10;
            opacity: 0;
            transform: scale(0.94);
            transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 1.4s ease, filter 1.4s ease;
        }

        /* Kotak Teks Sinematik */
        .cinematic-textbox {
            max-width: 580px; min-height: 55px; display: flex; align-items: center; justify-content: center;
            padding: 0 20px; z-index: 20;
        }
        .cinematic-text {
            font-size: 1.15rem; color: #f3f4f6; font-weight: 300; letter-spacing: 1.2px;
            line-height: 1.6; opacity: 0; transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
            text-align: center;
        }
        .cinematic-text.show { opacity: 1; }

        /* Kartu Ending (Hasil Lolos / Tidak Lolos) */
        #cinematic-ending-card {
            display: none; width: 90%; max-width: 440px; padding: 45px 35px; text-align: center;
            opacity: 0; transform: scale(0.96); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 5000; border-radius: 20px;
        }
        #cinematic-ending-card.reveal { display: block; opacity: 1; transform: scale(1); }

        /* Tema Lolos (Background Berubah Menjadi Putih Elegan) */
        #cinematic-screen.success-theme {
            background: #ffffff !important;
            color: #000000 !important;
            transition: background 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #cinematic-screen.success-theme .cinematic-text { color: #000000 !important; }
        #cinematic-screen.success-theme #cinematic-ending-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(0,0,0,0.1);
            color: #000000;
            box-shadow: 0 25px 60px rgba(0,0,0,0.12);
        }

        /* Tema Ditolak (Tetap Hitam Pekat Misterius) */
        #cinematic-screen.failed-theme {
            background: #000000 !important;
            color: #ffffff !important;
        }
        #cinematic-screen.failed-theme #cinematic-ending-card {
            background: rgba(10, 10, 10, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }

        /* Tampilan Website Utama (Sebelum/Sesudah Intro) */
        main { max-width: 650px; width: 100%; margin: 0 auto; padding: 30px 15px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hero-menu { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .hero-menu h1 { font-size: 2.2rem; font-weight: 300; letter-spacing: 2px; }
        .hero-menu p { color: var(--text-secondary); font-size: 0.9rem; max-width: 400px; line-height: 1.6; }

        .logo-glow-img {
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .glass-card {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        /* Modal Input Kode */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(15px);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { width: 90%; max-width: 400px; padding: 35px 30px; text-align: center; transform: scale(0.96); transition: transform 0.4s ease; }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .input-group { margin: 18px 0; text-align: left; }
        .input-group label { display: block; font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; font-weight: 500; letter-spacing: 1.2px; }
        .styled-input {
            width: 100%; padding: 13px 16px; background: rgba(5,5,5,0.98); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: var(--text-primary); font-family: var(--font-main); font-size: 0.9rem; outline: none; transition: border-color 0.3s;
        }
        .styled-input:focus { border-color: rgba(255,255,255,0.6); }

        .btn-primary {
            width: 100%; padding: 14px; background: #ffffff; color: #000000; border: none; border-radius: 10px;
            font-weight: 500; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(255,255,255,0.25); }

        .btn-secondary {
            background: transparent; color: var(--text-primary); border: 1px solid rgba(255,255,255,0.12); padding: 10px 18px;
            border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 0.82rem; transition: all 0.3s;
        }
        .btn-secondary:hover { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.05); }

        /* Toast Notifications */
        #toast-box { position: fixed; bottom: 25px; left: 25px; z-index: 7000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-item { background: rgba(10,10,10,0.96); border: 1px solid rgba(255,255,255,0.15); color: var(--text-primary); padding: 12px 18px; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); font-size: 0.85rem; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(12px); }

        footer { background: rgba(5,5,5,0.9); border-top: 1px solid rgba(255,255,255,0.08); padding: 20px; text-align: center; margin-top: auto; width: 100%; }
        .copyright { font-size: 0.75rem; color: #52525b; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; color: #000; box-shadow: 0 0 20px #fff;">B</div>
        <span style="font-size: 0.85rem; margin-top: 12px; letter-spacing: 2px; color: var(--text-secondary);">LOADING PORTAL...</span>
    </div>

    <audio id="cinematic-audio" src="idoberg-relaxing-cinematic-pads-303218.mp3" loop preload="auto"></audio>

    <div id="cinematic-screen">
        <div class="cinematic-vignette" id="cinematic-vignette"></div>
        <div class="cinematic-fog" id="cinematic-fog"></div>
        <canvas id="particle-canvas"></canvas>

        <div class="cinematic-stage" id="cinematic-stage">
            <div class="radial-glow-back" id="radial-glow-back"></div>
            <img src="logo.png" alt="Logo" class="cinematic-logo-img" id="cinematic-logo-img" onerror="this.src='https://via.placeholder.com/120/000000/ffffff?text=BLDS'">
        </div>

        <div class="cinematic-textbox">
            <div class="cinematic-text" id="cinematic-text-el"></div>
        </div>

        <div class="glass-card" id="cinematic-ending-card">
            <h2 id="ending-title-txt" style="font-size: 1.3rem; margin-bottom: 12px; font-weight: 400; letter-spacing: 1px;"></h2>
            <p id="ending-desc-txt" style="font-size: 0.9rem; line-height: 1.7; margin-bottom: 25px; opacity: 0.85;"></p>
            <button class="btn-primary" onclick="closeCinematicScreen()" id="ending-btn-action" style="max-width: 180px; margin: 0 auto;"></button>
        </div>
    </div>

    <main>
        <div class="hero-menu" id="section-home">
            <img src="logo.png" alt="Logo" class="logo-glow-img" onerror="this.src='https://via.placeholder.com/110/000000/ffffff?text=BLDS'">
            <h1 style="letter-spacing: 2px;">BLACKLIGHTDOMS</h1>
            <p>Portal Resmi Pendaftaran Staff & Verifikasi Akses Keamanan Eksklusif.</p>
            
            <div style="display: flex; gap: 10px; width: 100%; max-width: 300px; margin-top: 10px;">
                <button class="btn-primary" onclick="openCodeModal()">
                    Masukkan Kode Akses
                </button>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-code-input">
        <div class="modal-box glass-card">
            <h3 style="margin-bottom: 8px; font-weight: 400; letter-spacing: 1px;">VERIFIKASI KODE</h3>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 18px;">Masukkan kode unik registrasi Anda.</p>
            <form id="form-submit-code">
                <div class="input-group">
                    <input type="text" id="input-code-val" class="styled-input" style="text-align: center; letter-spacing: 1px;" placeholder="BLDS-NAMA-0001" required autocomplete="off">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 18px;">
                    <button type="button" class="btn-secondary" onclick="closeCodeModal()" style="flex:1;">Batal</button>
                    <button type="submit" class="btn-primary" style="flex:1;">Verifikasi</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-box"></div>

    <footer>
        <div class="copyright">BLACKLIGHTDOMS © 2026</div>
    </footer>

    <script>
        // Database lokal simulasi kode pendaftar
        let localCodes = JSON.parse(localStorage.getItem("blds_staff_codes")) || {
            "BLDS-DEMO-ACCEPTED": { Code: "BLDS-DEMO-ACCEPTED", Name: "Alex", Status: "Lolos" },
            "BLDS-DEMO-REJECTED": { Code: "BLDS-DEMO-REJECTED", Name: "Rian", Status: "Tidak Lolos" }
        };

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => document.getElementById("loading-screen").classList.add("hidden"), 300);
            initParticleCanvas();
        });

        function openCodeModal() { document.getElementById("modal-code-input").classList.add("active"); }
        function closeCodeModal() { document.getElementById("modal-code-input").classList.remove("active"); }

        // Canvas Particle Management (Elegan, Lambat, Acak 1-3px)
        let particleCtx, particleAnimId;
        const particles = [];
        function initParticleCanvas() {
            const canvas = document.getElementById("particle-canvas");
            particleCtx = canvas.getContext("2d");
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);

            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1, // 1 - 3 px
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: (Math.random() - 0.5) * 0.15,
                    alpha: Math.random() * 0.4 + 0.1
                });
            }
        }

        function resizeCanvas() {
            const canvas = document.getElementById("particle-canvas");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function startParticleLoop(pullToCenter = false) {
            const canvas = document.getElementById("particle-canvas");
            function render() {
                particleCtx.clearRect(0, 0, canvas.width, canvas.height);
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                particles.forEach(p => {
                    if (pullToCenter) {
                        let dx = centerX - p.x;
                        let dy = centerY - p.y;
                        p.x += dx * 0.01;
                        p.y += dy * 0.01;
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;
                    }

                    particleCtx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                    particleCtx.beginPath();
                    particleCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    particleCtx.fill();
                });
                particleAnimId = requestAnimationFrame(render);
            }
            render();
        }

        function stopParticleLoop() {
            cancelAnimationFrame(particleAnimId);
            if(particleCtx) particleCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }

        document.getElementById("form-submit-code").addEventListener("submit", (e) => {
            e.preventDefault();
            const val = document.getElementById("input-code-val").value.trim().toUpperCase();
            closeCodeModal();

            let matchedStaff = null;
            Object.keys(localCodes).forEach(k => {
                if (k.toUpperCase() === val) matchedStaff = localCodes[k];
            });

            if (!matchedStaff) {
                showToast("Akses Ditolak! Kode tidak terdaftar.", "error");
                return;
            }

            // Jalankan 20 Detik Pengalaman Sinematik AAA Game Intro
            start20SecondCinematicExperience(matchedStaff);
        });

        // ========================================================
        // TIMING STRICT 20 DETIK CINEMATIC INTRO
        // ========================================================
        function start20SecondCinematicExperience(staff) {
            const screen = document.getElementById("cinematic-screen");
            const audio = document.getElementById("cinematic-audio");
            const logoImg = document.getElementById("cinematic-logo-img");
            const textEl = document.getElementById("cinematic-text-el");
            const fogBox = document.getElementById("cinematic-fog");
            const vignette = document.getElementById("cinematic-vignette");
            const radialBack = document.getElementById("radial-glow-back");
            const stage = document.getElementById("cinematic-stage");
            const endingCard = document.getElementById("cinematic-ending-card");

            // Reset UI States
            screen.className = "";
            screen.classList.add("active");
            endingCard.classList.remove("reveal");
            endingCard.style.display = "none";
            textEl.innerText = "";
            textEl.classList.remove("show");
            fogBox.classList.remove("active");
            vignette.classList.remove("active");
            radialBack.style.opacity = "0";
            radialBack.style.transform = "scale(0.5)";
            stage.style.transform = "scale(1)";
            document.body.style.background = "#000000";

            // Audio Playback (Looping, Mulai 10% volume)
            audio.currentTime = 0;
            audio.volume = 0.10;
            audio.play().catch(err => {});
            startParticleLoop(false);

            // DETIK 0 - 2: Layar hitam total. Detik 0.5 ambience mulai (10%). Detik 0.6 logo Fade In 1.4s (0%->100%, scale 94%->100%), glow putih kecil.
            setTimeout(() => {
                logoImg.style.opacity = "1";
                logoImg.style.transform = "scale(1)";
                logoImg.style.boxShadow = "0 0 25px rgba(255,255,255,0.2)";
            }, 600);

            // DETIK 2 - 5: Kabut tipis 10%, particle halus acak, teks pertama muncul & fade out
            setTimeout(() => {
                fogBox.classList.add("active");
                setCinematicText("Every journey begins with a single decision.");
            }, 2000);

            // DETIK 5 - 8: Musik naik 30%, brightness background pulse (100%->108%->100%), particle mendekati logo, logo scale 100%->102%->100%, teks kedua
            setTimeout(() => {
                audio.volume = 0.30;
                stage.style.transform = "scale(1.02)";
                setTimeout(() => stage.style.transform = "scale(1)", 1500);
                setCinematicText("Not every path leads to the same destination.");
            }, 5000);

            // DETIK 8 - 11: Background blur nambah, lingkaran glow belakang membesar, pulse glow logo tiap 1.5s, musik naik 55%, teks ketiga
            setTimeout(() => {
                audio.volume = 0.55;
                radialBack.style.opacity = "1";
                radialBack.style.transform = "scale(1.8)";
                setCinematicText("Character outweighs potential.");
            }, 8000);

            // DETIK 11 - 15: Teks hilang, particle berhenti, kabut berhenti, logo jadi fokus, zoom in 104%, vignette hitam pinggir, musik naik 75%, cinematic hit lembut
            setTimeout(() => {
                textEl.classList.remove("show");
                stopParticleLoop();
                fogBox.classList.remove("active");
                stage.style.transform = "scale(1.04)";
                vignette.classList.add("active");
                audio.volume = 0.75;
            }, 11000);

            // DETIK 15 - 18: Particle hilang, glow logo lebih terang, logo scale 100%->108%, musik 90%
            setTimeout(() => {
                audio.volume = 0.90;
                logoImg.style.transform = "scale(1.08)";
                logoImg.style.boxShadow = "0 0 45px rgba(255,255,255,0.4)";
            }, 15000);

            // DETIK 18 - 20: Musik turun 25%, logo berhenti, hening 500ms, lalu cabang hasil
            setTimeout(() => {
                audio.volume = 0.25;
                setTimeout(() => {
                    executeEndingBranch(staff);
                }, 500);
            }, 18000);
        }

        function setCinematicText(text) {
            const el = document.getElementById("cinematic-text-el");
            el.classList.remove("show");
            setTimeout(() => {
                el.innerText = text;
                el.classList.add("show");
            }, 300);
        }

        function executeEndingBranch(staff) {
            const screen = document.getElementById("cinematic-screen");
            const audio = document.getElementById("cinematic-audio");
            const endingCard = document.getElementById("cinematic-ending-card");
            const titleTxt = document.getElementById("ending-title-txt");
            const descTxt = document.getElementById("ending-desc-txt");
            const btnAction = document.getElementById("ending-btn-action");

            document.getElementById("cinematic-stage").style.display = "none";
            document.getElementById("cinematic-text-el").style.display = "none";

            const isLolos = (staff.Status === "Lolos");

            if (isLolos) {
                // JIKA DITERIMA: Background berubah putih elegan dengan fade, logo jadi hitam, teks & button muncul
                screen.classList.add("success-theme");
                audio.volume = 0;
                audio.pause();

                titleTxt.innerText = "WELCOME TO THE NEXT CHAPTER";
                descTxt.innerHTML = `Congratulations, ${staff.Name}.<br>Your application has been accepted.`;
                btnAction.innerText = "Continue";
                btnAction.onclick = closeCinematicScreen;

                endingCard.style.display = "block";
                setTimeout(() => endingCard.classList.add("reveal"), 100);

            } else {
                // JIKA DITOLAK: Glow redup, tetap hitam, kabut tipis, logo mengecil 90%, teks & button muncul elegan
                screen.classList.add("failed-theme");
                audio.volume = 0;
                audio.pause();

                const logoImg = document.getElementById("cinematic-logo-img");
                logoImg.style.transform = "scale(0.90)";
                logoImg.style.boxShadow = "none";
                document.getElementById("cinematic-fog").classList.add("active");

                setTimeout(() => {
                    titleTxt.innerText = "THIS IS NOT THE END.";
                    descTxt.innerHTML = `Thank you for your effort, ${staff.Name}.<br>We hope to see you again.`;
                    btnAction.innerText = "Return";
                    btnAction.onclick = closeCinematicScreen;

                    document.getElementById("cinematic-stage").style.display = "flex";
                    endingCard.style.display = "block";
                    setTimeout(() => endingCard.classList.add("reveal"), 300);
                }, 500);
            }
        }

        function closeCinematicScreen() {
            document.getElementById("cinematic-screen").classList.remove("active");
            document.getElementById("input-code-val").value = "";
            try { document.getElementById("cinematic-audio").pause(); } catch(e){}
        }

        function showToast(msg, type = "info") {
            const box = document.getElementById("toast-box");
            const item = document.createElement("div");
            item.className = "toast-item";
            item.innerHTML = `<span>${msg}</span>`;
            box.appendChild(item);
            setTimeout(() => item.remove(), 3000);
        }
    </script>
</body>
</html>
